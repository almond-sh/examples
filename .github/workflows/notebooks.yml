name: Notebooks

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # weekly, to catch dependencies or external services breaking
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      notebooks: ${{ steps.list.outputs.notebooks }}
    steps:
      - uses: actions/checkout@v7
        with:
          # On PRs, the checked out commit merges the PR into its base branch, and its first parent
          # is the base branch commit
          fetch-depth: 2
      - uses: coursier/cache-action@v9
      - id: list
        # Each group of notebooks in the Mill build (see build.mill) gets a job. On PRs, only the groups
        # whose files changed since the base branch do, using Mill selective execution, if the base branch
        # has a Mill build already.
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          paths="$(./mill --ticker false show __.ciPath)"
          if [ "$IS_PR" = true ] && git cat-file -e HEAD^1:build.mill; then
            git checkout -q HEAD^1
            ./mill --ticker false selective.prepare __.check
            git checkout -q -
            notebooks="$(
              ./mill --ticker false show selective.resolve __.check |
                jq -c --argjson paths "$paths" '[.[] | $paths[sub("\\.check$"; ".ciPath")]] | sort'
            )"
          else
            notebooks="$(echo "$paths" | jq -c '[.[]] | sort')"
          fi
          echo "Notebooks to run: $notebooks"
          echo "notebooks=$notebooks" >> "$GITHUB_OUTPUT"

  run:
    needs: list
    if: needs.list.outputs.notebooks != '[]'
    name: ${{ matrix.notebook }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCALA_CLI_VERSION: 1.18.0
    strategy:
      fail-fast: false
      matrix:
        notebook: ${{ fromJSON(needs.list.outputs.notebooks) }}
    steps:
      - uses: actions/checkout@v7
      - uses: coursier/cache-action@v9
        with:
          # what the notebooks download depends on these
          extraFiles: '["Dockerfile", "scripts/run-notebooks.sc", "${{ matrix.notebook }}"]'
          # not run with Ammonite
          ignoreAmmonite: 'true'
      - run: docker build -t almond-examples .
      - name: Download Scala CLI
        # The image doesn't have Scala CLI, so we pass it one
        run: |
          mkdir -p ~/scala-cli
          curl -fL "https://github.com/VirtusLab/scala-cli/releases/download/v$SCALA_CLI_VERSION/scala-cli-x86_64-pc-linux.gz" |
            gzip -d > ~/scala-cli/scala-cli
          chmod +x ~/scala-cli/scala-cli
      - name: Run notebooks
        env:
          NOTEBOOK: ${{ matrix.notebook }}
        run: |
          mkdir -p ~/.cache/coursier/v1
          # the image runs as uid 1000, unlike the runner
          sudo chown -R 1000:100 ~/.cache/coursier/v1
          attempts=1
          if [ "$NOTEBOOK" = notebooks/http.ipynb ]; then
            # httpbin.org, queried by this notebook, is sometimes flaky
            attempts=3
          fi
          # The image has its own copy of the notebooks directory, in its home directory.
          # Scala CLI writes its build directory under /tmp, as /scripts is read-only.
          docker run --rm \
            -v "$PWD/scripts:/scripts:ro" \
            -v "$HOME/scala-cli:/scala-cli:ro" \
            -v "$HOME/.cache/coursier/v1:/coursier-cache" \
            -e COURSIER_CACHE=/coursier-cache \
            almond-examples \
            /scala-cli/scala-cli --server=false --workspace /tmp/run-notebooks /scripts/run-notebooks.sc -- \
              --attempts "$attempts" "${NOTEBOOK#notebooks/}"
